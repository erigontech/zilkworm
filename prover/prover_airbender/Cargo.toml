[package]
name = "z6m_prover_airbender"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "z6m_prover_airbender"
path = "src/main.rs"

[dependencies]
risc_v_simulator = { git = "https://github.com/somnergy/zksync-airbender", branch = "popzxc-cpp-example" }
clap = { version = "4.0", features = ["derive"] }
eyre = "0.6"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
