[package]
name = "z6m_prover_airbender"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "z6m_prover_airbender"
path = "src/main.rs"

[dependencies]
# Core VM (always needed for execution)
riscv_transpiler = { path = "../../../zksync-airbender/riscv_transpiler", features = ["delegation"] }

# Proving dependencies
execution_utils = { path = "../../../zksync-airbender/execution_utils", default-features = false, features = ["prover", "security_80", "verifier_binaries"] }
prover = { path = "../../../zksync-airbender/prover", features = ["prover"] }
worker = { path = "../../../zksync-airbender/worker" }
setups = { path = "../../../zksync-airbender/circuit_defs/setups" }

# GPU prover (optional, requires CUDA)
gpu_prover = { path = "../../../zksync-airbender/gpu_prover", optional = true }

# Shared z6m prover infrastructure (block fetching, RLP encoding)
z6m_common = { path = "../common" }

# Async runtime + networking
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
url = "2.5"

# CLI + serialization
clap = { version = "4.0", features = ["derive", "env"] }
eyre = "0.6"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
base64 = "0.22"
log = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[features]
default = []
gpu = ["dep:gpu_prover", "execution_utils/gpu_prover"]
