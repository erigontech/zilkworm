[package]
name = "z6m_prover_zisk"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "z6m_prover_zisk"
path = "src/main.rs"

# Standalone: zisk-sdk pins its own alloy/proofman tree.
[workspace]

[features]
default = ["cpu-only"]
cpu-only = ["zisk-sdk/cpu-only"]
gpu = []

[dependencies]
zisk-sdk = { version = "=1.3.1-alpha", default-features = false }
# Rebuildable execute-only client (see ZiskExecutor).
zisk-prover-backend = { version = "=1.3.1-alpha", default-features = false }
zisk-common = "=1.3.1-alpha"
# `--executor ziskemu`: the ziskemu CLI's engine.
zisk-core = "=1.3.1-alpha"
zisk-transpiler-riscv = "=1.3.1-alpha"
ziskemu = "=1.3.1-alpha"
z6m_common = { path = "../common" }

alloy-primitives = "1.0"
alloy-provider = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }
eyre = "0.6"
tokio = { version = "1", features = ["full"] }
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
chrono = "0.4"
serde_json = "1.0"
hex = "0.4"
dotenv = "0.15"
