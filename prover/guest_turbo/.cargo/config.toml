# C/C++ toolchain for the riscv32im-succinct-zkvm-elf guest build. sp1-build
# defaults only CC (to the bare gcc under ~/.sp1/bin, which has no matching
# g++); every C/C++ consumer in the dependency tree (cc-rs probes like
# link-cplusplus, the cc/cxx build scripts) needs the full toolchain, and
# build-script [env] can only be set here — a crate's own build.rs cannot
# export env to its dependencies' build scripts. The tools are named without
# a directory and resolve through PATH: the Makefile's turbo targets put the
# sp1 riscv32 toolchain (~/.sp1/riscv/riscv32im-linux-x86_64/bin by default)
# first on PATH.
[env]
CC_riscv32im_succinct_zkvm_elf = "riscv32-unknown-elf-gcc"
CXX_riscv32im_succinct_zkvm_elf = "riscv32-unknown-elf-g++"
AR_riscv32im_succinct_zkvm_elf = "riscv32-unknown-elf-ar"
