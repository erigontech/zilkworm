name: EEST RLP cache + convert
description: |
  Compute a content-addressed cache key for the converted batched-RLP fixture
  tree, restore from cache if present, and on a miss sparse-init the
  eest-fixtures submodule and run `bulk-convert` to populate the directory.

  Downstream test steps consume the populated path via the `dir` output:
  set `EEST_RLP_DIR` from `steps.<id>.outputs.dir` (where `<id>` is the
  step id given to this action's invocation in the calling workflow).

  The cache key is `(eest_sha, converter_src_sha)`. Any change to the EEST
  submodule pin or the converter source files yields a fresh key, ensuring
  CI never reads bytes produced by a stale conversion logic.

inputs:
  token:
    description: GitHub token used by init-submodules for private fetches.
    required: true

outputs:
  dir:
    description: Path to the populated batched-RLP tree.
    value: ${{ steps.cache-key.outputs.dir }}
  cache-hit:
    description: "'true' if the cache was restored verbatim, 'false' if rebuilt."
    value: ${{ steps.rlp-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Compute RLP cache key
      id: cache-key
      shell: bash
      run: |
        # eest_sha comes from the parent gitlink, no submodule init required.
        eest_sha=$(git ls-tree HEAD third_party/eest-fixtures | awk '{print $3}')
        conv_sha=$(sha256sum \
            prover/common/src/eest_json_to_unified_rlp.rs \
            prover/common/src/rlp_methods.rs \
            prover/common/src/bin/z6m_eest_convert.rs \
            prover/common/Cargo.toml \
            prover/Cargo.lock \
          | sha256sum | cut -c1-12)
        key="rlp-eest-${eest_sha:0:12}-${conv_sha}"
        dir="third_party/eest-fixtures-rlp/${key}"
        echo "key=${key}" >> "$GITHUB_OUTPUT"
        echo "dir=${dir}" >> "$GITHUB_OUTPUT"

    - name: Restore RLP cache
      uses: actions/cache/restore@v4
      id: rlp-cache
      with:
        path: ${{ steps.cache-key.outputs.dir }}
        key: ${{ steps.cache-key.outputs.key }}

    - name: Init eest-fixtures (sparse, cache miss only)
      if: steps.rlp-cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/init-submodules
      with:
        token: ${{ inputs.token }}
        sparse-eest-fixtures: "true"

    - name: Build + run converter (cache miss only)
      if: steps.rlp-cache.outputs.cache-hit != 'true'
      shell: bash
      run: make eest-rlp-build EEST_RLP_DIR=${{ steps.cache-key.outputs.dir }}

    # Save immediately after the converter so the cache survives even when a
    # downstream test step fails. `actions/cache@v4`'s default post-step save
    # only runs on full job success, which masked the cache as permanently
    # missing while the eest pipeline was failing for other reasons.
    - name: Save RLP cache
      if: steps.rlp-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.cache-key.outputs.dir }}
        key: ${{ steps.cache-key.outputs.key }}
