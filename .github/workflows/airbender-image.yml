# Publishes the Airbender GPU prover image (prover/Dockerfile, target airbender) for every commit
# merged to main, tagged with the commit: ghcr.io/erigontech/zilkworm-airbender:<sha> (full and
# short) and :main for the latest. The image runs as is on a GPU host or on vast.ai; see
# docs/airbender-docker-service.md. The package stays private until an org admin makes it public
# (once, in its package settings).
name: Airbender Prover Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: airbender-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/erigontech/zilkworm-airbender

jobs:
  build-and-push:
    name: Build and push the Airbender prover image
    runs-on: ubuntu-latest
    environment: ci
    timeout-minutes: 240
    steps:
      # The CUDA devel base image and the prover's build need more disk than the runner leaves free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          submodules: false

      - name: Init submodules
        uses: ./.github/actions/init-submodules
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=sha,prefix=
            type=raw,value=main
          labels: |
            org.opencontainers.image.title=zilkworm-airbender
            org.opencontainers.image.description=Zilkworm Airbender GPU prover and proving service

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: prover/Dockerfile
          target: airbender
          push: true
          # ZILKWORM_REVISION names the verification key the entrypoint computes; CUDA_ARCHS keeps
          # the Dockerfile's default ("80;89;90;120": A100, Ada, Hopper, RTX Blackwell).
          build-args: |
            ZILKWORM_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=airbender-image
          cache-to: type=gha,scope=airbender-image,mode=min

      - name: Summary
        run: |
          {
            echo "### Airbender prover image"
            echo
            echo '```'
            echo "${{ env.IMAGE }}:${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
