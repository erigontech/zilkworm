name: Airbender EEST Blockchain Tests

on:
  push:
    branches: [master, main]
    paths:
      - 'prover/guest_airbender/**'
      - 'prover/prover_airbender/**'
      - 'zilk_core/**'
      - 'third_party/**'
  pull_request:
    branches: [master, main]
    paths:
      - 'prover/guest_airbender/**'
      - 'prover/prover_airbender/**'
      - 'zilk_core/**'
      - 'third_party/**'
  workflow_dispatch:

jobs:
  airbender-eest:
    name: Build and Run Airbender EEST Blockchain Tests
    runs-on: ubuntu-latest
    container: ubuntu:25.10
    environment: ci
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          apt update
          apt install -y \
            build-essential cmake ninja-build \
            git git-lfs \
            python3 \
            nodejs npm \
            curl
          npm i -g xpm
          xpm install @xpack-dev-tools/riscv-none-elf-gcc@latest --global --verbose
          RISCV_GCC_BIN=$(find $HOME/.local/xPacks/@xpack-dev-tools/riscv-none-elf-gcc -name 'riscv-none-elf-gcc' -type f 2>/dev/null | head -1 | xargs dirname)
          echo "Found riscv-gcc at: $RISCV_GCC_BIN"
          ls -la "$RISCV_GCC_BIN/" | head -5
          echo "$RISCV_GCC_BIN" >> $GITHUB_PATH
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify tool versions
        run: |
          riscv-none-elf-gcc --version
          riscv-none-elf-g++ --version
          cmake --version
          ninja --version
          git --version
          git lfs version
          rustc --version
          cargo --version

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Configure cargo for private dependencies
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'TOML'
          [net]
          git-fetch-with-cli = true
          TOML
          # Strip leading whitespace from heredoc (GitHub Actions indentation)
          sed -i 's/^[[:space:]]*//' ~/.cargo/config.toml

      - name: Download pinned EEST fixtures
        run: tools/test-fixtures.sh test-fixtures.json test-fixtures-cache eest_stable

      - name: Build guest ELF
        run: make z6m_guest_airbender

      - name: Build prover
        run: make z6m_prover_airbender

      - name: Run EEST blockchain tests
        id: run_tests
        shell: bash
        run: |
          set +e
          cd prover/prover_airbender
          make -j"$(nproc)" eest 2>&1 | tee output.log
          exit_code=${PIPESTATUS[0]}

          # A test passes only if the guest reported success (or skipped it): a run that stops at
          # the cycle limit exits cleanly without either line.
          export LC_ALL=C
          find target/eest-logs -name '*.log' 2>/dev/null | sort > all.txt
          grep -rlE 'run successful|run skipped' target/eest-logs/ 2>/dev/null | sort > ok.txt
          comm -23 all.txt ok.txt | sed 's#^target/eest-logs/##; s#\.log$#.json#' > failed.txt
          grep -vE '^[[:space:]]*(#|$)' eest-known-failures.txt | sort > known.txt
          comm -23 failed.txt known.txt > unexpected.txt
          comm -13 failed.txt known.txt > fixed.txt

          total=$(wc -l < all.txt)
          failed=$(wc -l < failed.txt)
          unexpected=$(wc -l < unexpected.txt)
          passed=$((total - failed))

          if (( total > 0 )); then
            passed_percent=$(( passed * 100 / total ))
          else
            passed_percent=0
          fi

          echo "passed=$passed" >> $GITHUB_OUTPUT
          echo "passed_percent=$passed_percent" >> $GITHUB_OUTPUT
          echo "failed=$failed" >> $GITHUB_OUTPUT
          echo "unexpected=$unexpected" >> $GITHUB_OUTPUT
          echo "total=$total" >> $GITHUB_OUTPUT
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT

      - name: Print test summary
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "   AIRBENDER EEST BLOCKCHAIN TEST SUMMARY"
          echo "========================================"
          echo ""
          echo "Passed: ${{ steps.run_tests.outputs.passed }} / ${{ steps.run_tests.outputs.total }} (${{ steps.run_tests.outputs.passed_percent }}%)"
          echo "Failed: ${{ steps.run_tests.outputs.failed }} (unexpected: ${{ steps.run_tests.outputs.unexpected }})"
          echo "========================================"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airbender-eest-logs
          path: |
            prover/prover_airbender/output.log
            prover/prover_airbender/failed.txt
            prover/prover_airbender/unexpected.txt
            prover/prover_airbender/target/eest-logs/
          retention-days: 30

      - name: Check for unexpected failures
        if: always()
        shell: bash
        working-directory: prover/prover_airbender
        run: |
          total=${{ steps.run_tests.outputs.total }}
          unexpected=${{ steps.run_tests.outputs.unexpected }}

          if [[ "$total" == "0" ]]; then
            echo "ERROR: No test results found"
            exit 1
          fi

          if [[ -s fixed.txt ]]; then
            echo "Known failures that now pass (remove them from eest-known-failures.txt):"
            cat fixed.txt
          fi

          if (( unexpected > 0 )); then
            echo "${unexpected} test(s) failed outside eest-known-failures.txt:"
            cat unexpected.txt
            exit 1
          fi

          echo "SUCCESS: no unexpected failures in ${total} tests"
