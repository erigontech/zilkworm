name: Hypercube 200-block Bench

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  sp1-benchmark:
    name: Run SP1 Benchmark
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/erigontech/z6m-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init -v /tmp/z6m-cargo-cache:/cargo-cache -v /tmp/z6m-benchmark-blocks:/benchmark-blocks
    env:
      CARGO_HOME: /cargo-cache/cargo
    steps:
      - name: Prepare local cargo cache
        run: |
          mkdir -p /cargo-cache/cargo /cargo-cache/target
          cat > /cargo-cache/cargo/config.toml <<'TOML'
          [net]
          git-fetch-with-cli = true
          TOML

      - name: Verify tool versions
        run: |
          cmake --version
          rustc --version
          riscv-none-elf-gcc --version
          protoc --version

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          submodules: false
          lfs: true

      - name: Init submodules (skip eest-fixtures)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://x-access-token:${{ secrets.PAT_TOKEN || github.token }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive third_party/evmone third_party/intx

      - name: Symlink cargo target for caching
        run: |
          if [ ! -d prover/target ] && [ -d /cargo-cache/target ]; then
            ln -s /cargo-cache/target prover/target
          elif [ -d prover/target ] && [ ! -L prover/target ]; then
            mv prover/target/* /cargo-cache/target/ 2>/dev/null || true
            rm -rf prover/target
            ln -s /cargo-cache/target prover/target
          fi

      - name: Build z6m_prover
        run: make z6m_prover

      - name: Download benchmark blocks
        run: |
          if [ -d /benchmark-blocks/200_benchmark_blocks ] && [ "$(ls -d /benchmark-blocks/200_benchmark_blocks/*/ 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "Using cached blocks from local volume"
          else
            mkdir -p /benchmark-blocks
            curl -L -o /tmp/200_benchmark_blocks.tar.gz \
              "https://github.com/erigontech/zilkworm-testdata/releases/download/benchmark-200-spread/200_benchmark_blocks.tar.gz"
            tar xzf /tmp/200_benchmark_blocks.tar.gz -C /benchmark-blocks
            rm -f /tmp/200_benchmark_blocks.tar.gz
          fi
          ls /benchmark-blocks/200_benchmark_blocks/ | head -5
          echo "Total blocks: $(ls -d /benchmark-blocks/200_benchmark_blocks/*/ | wc -l)"

      - name: Run sp1-benchmkar.py on all blocks
        id: benchmark
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 tools/scripts/sp1_benchmark.py --dir /benchmark-blocks/200_benchmark_blocks
      - name: Check results
        run: |
          failed=${{ steps.benchmark.outputs.failed }}
          total=${{ steps.benchmark.outputs.total }}

          if [ "$total" -eq 0 ]; then
            echo "ERROR: No blocks were tested"
            exit 1
          fi

          if [ "$failed" -gt 0 ]; then
            echo "FAIL: $failed / $total blocks failed"
            echo "Failed blocks: ${{ steps.benchmark.outputs.failed_blocks }}"
            exit 1
          fi

          echo "SUCCESS: All $total blocks passed"
