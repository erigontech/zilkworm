name: Unit Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/erigontech/zilkworm-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Verify tool versions
        run: |
          gcc --version
          g++ --version
          cmake --version
          ninja --version
          ctest --version

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          submodules: false

      - name: Init submodules
        uses: ./.github/actions/init-submodules
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build unit tests
        run: cmake --build build --target zilkworm.tests

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure --parallel

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: build/Testing/Temporary/LastTest.log
          retention-days: 30

  # The HashState backend (Z6M_HASH_STATE=ON): DirectState-witness execution suites left out.
  unit-tests-hashstate:
    name: Run Unit Tests (HashState backend)
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/erigontech/zilkworm-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          submodules: false

      - name: Init submodules
        uses: ./.github/actions/init-submodules
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DZ6M_HASH_STATE=ON

      - name: Build unit tests
        run: cmake --build build --target zilkworm.tests

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure --parallel

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-hashstate-logs
          path: build/Testing/Temporary/LastTest.log
          retention-days: 30

  # The rv32 paths (EVMONE_RV32_DISPATCH_TEST) under ASan and UBSan, at -O2 without -DNDEBUG, with USE_HASH_KEY=ON.
  unit-tests-rv32-paths:
    name: Run Unit Tests (rv32 paths, ASan+UBSan)
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/erigontech/zilkworm-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SAN_FLAGS: -DEVMONE_RV32_DISPATCH_TEST -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          submodules: false

      - name: Init submodules
        uses: ./.github/actions/init-submodules
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DUSE_HASH_KEY=ON
          "-DCMAKE_C_FLAGS=$SAN_FLAGS" "-DCMAKE_CXX_FLAGS=$SAN_FLAGS"
          "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O2 -g" "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -g"
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined

      - name: Build unit tests
        run: cmake --build build --target zilkworm.tests

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure --parallel

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-rv32-logs
          path: build/Testing/Temporary/LastTest.log
          retention-days: 30
