name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release for, e.g. v0.1.0-alpha.4
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Before anything is published (the Airbender job tags an image).
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    outputs:
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # alpha/beta/rc tags carry a '-' suffix -> mark as pre-release.
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: CMakeLists.txt
          sparse-checkout-cone-mode: false

      - name: Verify tag matches PROJECT_VERSION
        shell: bash
        run: |
          cmake_ver=$(grep -oP 'set\(PROJECT_VERSION \K[^)]+' CMakeLists.txt)
          if [[ "$cmake_ver" != "${{ steps.ver.outputs.version }}" ]]; then
            echo "Tag $TAG implies version ${{ steps.ver.outputs.version }}, but CMakeLists.txt PROJECT_VERSION is $cmake_ver" >&2
            exit 1
          fi

  # The release commit's Airbender prover image, tagged with the release tag, and the guest and
  # verification key taken from it.
  airbender:
    name: Airbender image and assets
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/airbender-image.yml
    with:
      release_tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit

  release:
    name: Build artifacts and publish release
    needs: [version, airbender]
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/erigontech/zilkworm-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          submodules: false

      - name: Init submodules
        uses: ./.github/actions/init-submodules
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          sparse-eest-fixtures: "skip"

      - name: Build the guests, their VKs and the prover
        run: make z6m_prover z6m_guest_vk ere-bin

      - name: Build state_transition CLI
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target state_transition -j"$(nproc)"

      - name: Stage release artifacts
        run: make release-artifacts

      - name: Download the Airbender assets
        uses: actions/download-artifact@v4
        with:
          name: airbender-release-assets
          path: temp

      - name: Add the Airbender assets to SHA256SUMS.txt
        working-directory: temp
        run: |
          sha256sum z6m_guest_airbender.bin z6m_guest_airbender.text z6m_guest_airbender.vk >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract changelog section
        shell: bash
        env:
          AIRBENDER_DIGEST: ${{ needs.airbender.outputs.digest }}
          AIRBENDER_VK_SHA256: ${{ needs.airbender.outputs.vk_sha256 }}
        run: |
          awk -v tag="$TAG" '
            $0 ~ "^## " tag "([ ]|$)" { f=1; print; next }
            f && /^## / { f=0 }
            f { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [[ ! -s RELEASE_NOTES.md ]]; then
            echo "No CHANGELOG.md section found for $TAG." > RELEASE_NOTES.md
          fi
          if [[ -z "$AIRBENDER_DIGEST" || -z "$AIRBENDER_VK_SHA256" ]]; then
            echo "The Airbender job did not report the image digest and the verification key's sha256" >&2
            exit 1
          fi
          {
            echo
            echo "### Hypercube guests"
            echo
            echo "- \`z6m_guest_hypercube_mfbd.{elf,vk}\`: DirectState, takes MFBD bundles; \`stateless-validator-zilkworm-sp1-<SP1 SDK version>.{elf,vk}\`: HashState, takes statelessInputBytes (the ERE guest, named as the guest handbook asks)"
            echo
            echo "### Airbender image and verification key"
            echo
            echo "- Image: \`ghcr.io/erigontech/zilkworm-airbender:$TAG\` (digest \`$AIRBENDER_DIGEST\`)"
            echo "- Verification key for this release's guest: \`z6m_guest_airbender.vk\` (sha256 \`$AIRBENDER_VK_SHA256\`). Upload it to your Ethproofs cluster so its proofs show as verified"
          } >> RELEASE_NOTES.md
          printf '\n---\nReleased by @%s\n' "$GITHUB_ACTOR" >> RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Zilkworm ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.version.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            temp/z6m_guest_hypercube_mfbd.elf
            temp/z6m_guest_hypercube_mfbd.vk
            temp/stateless-validator-zilkworm-sp1-*.elf
            temp/stateless-validator-zilkworm-sp1-*.vk
            temp/z6m_prover_hypercube
            temp/state_transition_linux_x86_64
            temp/z6m_guest_airbender.bin
            temp/z6m_guest_airbender.text
            temp/z6m_guest_airbender.vk
            temp/SHA256SUMS.txt

  # Called rather than triggered: releases published with GITHUB_TOKEN emit no release event.
  ere-benchmark:
    name: ERE benchmark
    needs: release
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ere-benchmark.yml
    with:
      guest_source: release
      release_tag: ${{ github.event.inputs.tag || github.ref_name }}
      compare: true
    secrets: inherit
