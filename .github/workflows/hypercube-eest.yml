name: HyperCube EEST Blockchain Tests

on:
  push:
    branches: [master, main, release/*]
    paths:
      - '.github/workflows/hypercube-eest.yml'
      - 'tools/scripts/eest_runner.py'
      - 'prover/guest_hypercube/**'
      - 'prover/prover_hypercube/**'
      - 'zilk_core/core/**'
      - 'third_party/evmone/lib/**'
  workflow_dispatch:

jobs:
  eest:
    name: HyperCube EEST
    runs-on: ubuntu-latest
    container:
      image: somnergy/z6m_ci_base:latest
      options: --init -v /tmp/z6m-cargo-cache:/cargo-cache
    environment: ci
    env:
      CARGO_HOME: /cargo-cache/cargo
    steps:
      - name: Prepare local cargo cache
        run: |
          mkdir -p /cargo-cache/cargo /cargo-cache/target
          cat > /cargo-cache/cargo/config.toml <<'TOML'
          [net]
          git-fetch-with-cli = true
          TOML

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          submodules: false

      - name: Init submodules
        uses: ./.github/actions/init-submodules
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          sparse-eest-fixtures: "skip"

      - name: Symlink cargo target for caching
        run: |
          if [ ! -d prover/target ] && [ -d /cargo-cache/target ]; then
            ln -s /cargo-cache/target prover/target
          elif [ -d prover/target ] && [ ! -L prover/target ]; then
            # First run or checkout created it — move to cache
            mv prover/target/* /cargo-cache/target/ 2>/dev/null || true
            rm -rf prover/target
            ln -s /cargo-cache/target prover/target
          fi

      - name: Build prover
        run: make z6m_prover

      - name: Prepare EEST MFBD fixtures
        id: eest-mfbd
        uses: ./.github/actions/prepare-eest-mfbd
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Run EEST tests
        shell: bash
        env:
          EEST_MFBD_DIR: ${{ steps.eest-mfbd.outputs.dir }}
        run: |
          python3 tools/scripts/eest_runner.py \
            --stagger 15 \
            --log-dir eest-logs \
            --fail-threshold 5

      - name: Test summary
        if: always()
        shell: bash
        run: |
          total=0; passed=0; failed=0; skipped=0
          for f in eest-logs/*.log; do
            [ -f "$f" ] || continue
            line=$(grep '^Total:' "$f" || true)
            if [ -n "$line" ]; then
              t=$(echo "$line" | grep -oP 'Total: \K[0-9]+')
              p=$(echo "$line" | grep -oP 'Passed: \K[0-9]+')
              fl=$(echo "$line" | grep -oP 'Failed: \K[0-9]+')
              s=$(echo "$line" | grep -oP 'Skipped: \K[0-9]+' || echo 0)
              total=$((total + t))
              passed=$((passed + p))
              failed=$((failed + fl))
              skipped=$((skipped + s))
            fi
          done
          echo "========================================"
          echo "  EEST RESULTS"
          echo "========================================"
          echo "  Total:   $total"
          echo "  Passed:  $passed"
          echo "  Failed:  $failed"
          echo "  Skipped: $skipped"
          echo "========================================"
          if [ "$failed" -gt 5 ]; then
            echo "FAIL: $failed failures exceed threshold"
            exit 1
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eest-logs
          path: eest-logs/
          retention-days: 30
