name: ZisK 200-block Bench

on:
  push:
    branches: [master, main, release/*]
    paths:
      - '.github/workflows/zisk-benchmark.yml'
      - '.github/docker/zisk-ci.Dockerfile'
      - 'tools/scripts/sp1_benchmark.py'
      - 'prover/guest_zisk/**'
      - 'prover/prover_zisk/**'
      - 'prover/common/**'
      - 'prover/witness_ffi/**'
      - 'zilk_core/core/**'
      - 'zilk_core/dev/**'
      - 'third_party/evmone/lib/**'
      - 'third_party/evmone'
  pull_request:
    branches: [master, main, release/*]
    paths:
      - '.github/workflows/zisk-benchmark.yml'
      - '.github/docker/zisk-ci.Dockerfile'
      - 'tools/scripts/sp1_benchmark.py'
      - 'prover/guest_zisk/**'
      - 'prover/prover_zisk/**'
      - 'prover/common/**'
      - 'prover/witness_ffi/**'
      - 'zilk_core/core/**'
      - 'zilk_core/dev/**'
      - 'third_party/evmone/lib/**'
      - 'third_party/evmone'
  workflow_dispatch:

jobs:
  zisk-benchmark:
    name: Run ZisK Benchmark
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/erigontech/zilkworm-ci-zisk:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init -v /tmp/z6m-cargo-cache:/cargo-cache -v /tmp/z6m-benchmark-blocks:/benchmark-blocks
    env:
      CARGO_HOME: /cargo-cache/cargo
    steps:
      - name: Prepare local cargo cache
        run: |
          mkdir -p /cargo-cache/cargo /cargo-cache/target-zisk
          # Wipe extracted crate sources:
          # this only forces re-extraction, not re-download.
          rm -rf /cargo-cache/cargo/registry/src
          cat > /cargo-cache/cargo/config.toml <<'TOML'
          [net]
          git-fetch-with-cli = true
          TOML

      - name: Verify tool versions
        run: |
          cmake --version
          rustc --version
          riscv-none-elf-gcc --version
          protoc --version
          ziskemu --help | head -1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          submodules: false
          lfs: true

      - name: Init submodules
        uses: ./.github/actions/init-submodules
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Symlink cargo target for caching
        run: |
          # prover_zisk has its own workspace target dir.
          if [ ! -d prover/prover_zisk/target ] && [ -d /cargo-cache/target-zisk ]; then
            ln -s /cargo-cache/target-zisk prover/prover_zisk/target
          elif [ -d prover/prover_zisk/target ] && [ ! -L prover/prover_zisk/target ]; then
            mv prover/prover_zisk/target/* /cargo-cache/target-zisk/ 2>/dev/null || true
            rm -rf prover/prover_zisk/target
            ln -s /cargo-cache/target-zisk prover/prover_zisk/target
          fi

      - name: Drop stale build-script artifacts
        # Stale .fingerprint marks build scripts fresh but their OUT_DIR is evicted; force re-run.
        run: rm -rf prover/prover_zisk/target/release/build prover/prover_zisk/target/release/.fingerprint

      - name: Build guest ELF and prover
        run: make z6m_prover_zisk

      - name: Download raw benchmark blocks
        run: |
          # Cache RAW blocks, not a pinned .mfbd corpus (goes stale on version bumps).
          if [ -d /benchmark-blocks/200_benchmark_blocks ] && [ "$(ls -d /benchmark-blocks/200_benchmark_blocks/*/ 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "Using cached raw blocks from local volume"
          else
            mkdir -p /benchmark-blocks
            curl -L -o /tmp/200_benchmark_blocks.tar.gz \
              "https://github.com/erigontech/zilkworm-testdata/releases/download/benchmark-200-spread/200_benchmark_blocks.tar.gz"
            tar xzf /tmp/200_benchmark_blocks.tar.gz -C /benchmark-blocks
            rm -f /tmp/200_benchmark_blocks.tar.gz
          fi
          ls /benchmark-blocks/200_benchmark_blocks/ | head -5
          echo "Total raw blocks: $(ls -d /benchmark-blocks/200_benchmark_blocks/*/ | wc -l)"

      - name: Regenerate benchmark corpus with current converter
        run: |
          # Regenerate corpus with the just-built converter (matches current wire format).
          make sp1-benchmark-corpus \
            BENCH_SRC_DIR=/benchmark-blocks/200_benchmark_blocks \
            BENCH_CORPUS_DIR=/benchmark-blocks/200_benchmark_blocks_corpus
          echo "Corpus blocks: $(ls -d /benchmark-blocks/200_benchmark_blocks_corpus/*/ | wc -l)"

      - name: Run sp1_benchmark.py with the ZisK host on all blocks
        id: benchmark
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          # zisk-sdk emulator, execute-only.
          Z6M_ZISK_EXECUTOR: emulator
        run: |
          set +e
          python3 tools/scripts/sp1_benchmark.py \
            --prover prover/prover_zisk/target/release/z6m_prover_zisk \
            --ram-per-instance 16 \
            --dir /benchmark-blocks/200_benchmark_blocks_corpus 2>&1 | tee bench-output.log
          exit_code=${PIPESTATUS[0]}

          out=$(grep -oP '^\s*Output directory: \K.*' bench-output.log | tail -1)
          expected=$(find /benchmark-blocks/200_benchmark_blocks_corpus -mindepth 1 -maxdepth 1 -type d | wc -l)
          total=0; failed=0
          if [ -n "$out" ]; then
            total=$(grep -c ' executed, ' "$out/execution.log" || true)
            failed=$(cat "$out"/chunk_*.log.stdout 2>/dev/null | grep -cE '^(FAILED|SKIPPED) block' || true)
          fi
          {
            echo "out_dir=$out"
            echo "expected=$expected"
            echo "total=$total"
            echo "failed=$failed"
            echo "exit_code=$exit_code"
          } >> "$GITHUB_OUTPUT"

      - name: Upload benchmark logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zisk-benchmark-logs
          path: |
            bench-output.log
            ${{ steps.benchmark.outputs.out_dir }}
          retention-days: 30

      - name: Check results
        shell: bash
        run: |
          expected=${{ steps.benchmark.outputs.expected }}
          total=${{ steps.benchmark.outputs.total }}
          failed=${{ steps.benchmark.outputs.failed }}
          exit_code=${{ steps.benchmark.outputs.exit_code }}

          if [ "$exit_code" -ne 0 ]; then
            echo "ERROR: sp1_benchmark.py exited with $exit_code"
            exit 1
          fi

          if [ "$total" -eq 0 ]; then
            echo "ERROR: No blocks were tested"
            exit 1
          fi

          # Host errors leave a block unlogged.
          if [ "$failed" -gt 0 ] || [ "$total" -ne "$expected" ]; then
            echo "FAIL: $failed failed, $total / $expected blocks logged"
            exit 1
          fi

          echo "SUCCESS: All $total blocks passed"
